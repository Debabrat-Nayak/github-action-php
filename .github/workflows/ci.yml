name: Laravel CI Pipeline

on:
  push:
    branches:
      - master-staging
      - master

  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-checks:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install Dependencies
        run: composer install

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate App Key
        run: php artisan key:generate

      - name: Run Naming Convention Check
        run: php scripts/naming-check.php

      - name: Run PHPMD
        run: |
          vendor/bin/phpmd app text phpmd.xml

      - name: Run Pest Tests
        run: vendor/bin/pest