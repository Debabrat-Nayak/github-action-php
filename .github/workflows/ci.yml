name: Laravel CI Pipeline

on:
  push:
    branches:
      - master
      - master-staging

  pull_request:
    branches:
      - main
      - develop

jobs:

  naming-convention:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - run: composer install

      - name: Validate Project Naming Standards
        run: php scripts/naming-check.php


  code-detection:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - run: composer install

      - name: Detect Code Quality Issues
        run: vendor/bin/phpmd routes text phpmd.xml

  static-code-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - run: composer install

      - name: Analyze Application Code
        run: vendor/bin/phpstan analyse


  pest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - run: composer install

      - run: cp .env.example .env

      - run: php artisan key:generate

      - name: Run Pest Tests
        run: vendor/bin/pest